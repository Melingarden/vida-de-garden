<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida de Garden Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a cosy little walk-around game, playful and warm
   IDEA a small Portuguese street seen from above: our plant shop, the nursery across the road, neighbours and cars
   PICTURE the live world filling the screen, the gardener you control walking in it
   COLOUR grass greens lead, warm wood and terracotta support, magenta accent for the action button
   TYPE Fredoka for labels, Nunito for text
   LAYOUT full-screen canvas; chips on top; joystick zone on the left, action button on the right; sheets slide up from the bottom */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#2b3a2e;overflow:hidden;font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);color:#13281c;border-radius:999px;padding:6px 12px 6px 8px;font:800 15px/1 Nunito,sans-serif;min-height:40px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.chip img{width:26px;height:26px;object-fit:contain}
.chip b{font:700 17px/1 Fredoka,sans-serif}
.chip.loc{background:#13281c;color:#fff}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));max-width:min(92vw,460px);background:rgba(19,40,28,.9);color:#fff;border-radius:14px;padding:8px 14px;font:700 15px/1.3 Nunito,sans-serif;text-align:center;pointer-events:none}
.hint:empty{display:none}
#act{position:fixed;z-index:4;right:max(18px,env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:#c92468;color:#fff;font:800 14px/1.15 Nunito,sans-serif;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);touch-action:none}
#act:disabled{background:#7d8a80}
#act:focus-visible{outline:3px solid #ffd84a;outline-offset:3px}
.toast{position:fixed;z-index:6;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#13281c;border-radius:30px;padding:9px 18px;font:800 15px Nunito,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.fade{position:fixed;inset:0;z-index:5;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.back{position:fixed;inset:0;z-index:8;background:rgba(5,20,12,.55);display:grid;align-items:end;justify-items:center}
@media(min-width:700px){.back{align-items:center}}
.sheet{background:#f4f1e6;color:#13281c;width:min(100%,520px);max-height:86svh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,4vw) max(18px,env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet h2{font:600 26px/1.1 Fredoka,sans-serif;margin:0 0 6px}
.sheet p{margin:4px 0 10px;font-size:15px;color:#3c5243}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:6px 10px;margin-top:8px}
.row img{width:52px;height:52px;object-fit:contain}
.row small{display:block;color:#4b6352;font-size:13px}
.btn{border:0;border-radius:30px;padding:10px 18px;min-height:44px;font:800 15px Nunito,sans-serif;background:#2f7a2a;color:#fff;cursor:pointer}
.btn.alt{background:transparent;border:2px solid #c4d6b0;color:#13281c}
.btn:disabled{opacity:.4}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:10px 0 14px}
.land .hint{bottom:auto;top:calc(56px + env(safe-area-inset-top));max-width:52vw;font-size:14px}.land .chip{min-height:34px;padding:4px 10px 4px 6px}.land .back{align-items:center}.land .sheet{border-radius:22px;max-height:94svh}.land #act{width:88px;height:88px;bottom:calc(20px + env(safe-area-inset-bottom))}.land .toast{top:auto;bottom:calc(20px + env(safe-area-inset-bottom))}
#game{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#game.rot90 #cv{position:absolute}
#game.rot90 .sheet{max-height:calc(var(--gh) - 20px)}#game.rot90 .hint{max-width:calc(var(--gw)*.5)}#game.rot90 .toast{max-width:calc(var(--gw)*.8)}
.hud{right:76px}
#menu{position:fixed;z-index:4;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:58px;height:48px;border-radius:16px;border:3px solid #fff;background:#13281c;color:#fff;font:700 13px/1 Fredoka,sans-serif;display:grid;place-items:center;padding:2px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#menu span{font-size:20px;line-height:1}
#menu[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:#c92468;color:#fff;font:800 12px/22px Nunito,sans-serif;text-align:center;border:2px solid #fff}
.sheet.wide{width:min(100%,680px)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 10px;padding-bottom:2px;position:sticky;top:-18px;background:#f4f1e6;z-index:1;padding-top:4px}
.tabs button{flex:0 0 auto;border:0;border-radius:14px;background:#fff;color:#13281c;font:800 13px Nunito,sans-serif;padding:6px 10px;min-height:44px;display:flex;align-items:center;gap:5px;position:relative;cursor:pointer}
.tabs button span{font-size:18px}
.tabs button[aria-pressed=true]{background:#13281c;color:#fff}
.tabs button em{font-style:normal;background:#c92468;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px}
.tabs button:last-child{margin-left:auto;font-size:18px;width:44px;justify-content:center}
.money{font:600 15px Fredoka,sans-serif;margin:0 0 6px;color:#3c5243}.money b{font-size:20px;color:#13281c}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 20px Fredoka,sans-serif;justify-self:center}
.stp{display:flex;align-items:center;gap:6px}
.stp>button:not(.btn){width:40px;height:40px;border-radius:50%;border:2px solid #c4d6b0;background:#fff;font:800 20px/1 Nunito,sans-serif;color:#13281c;cursor:pointer}
.stp b{font:700 17px Fredoka,sans-serif;min-width:44px;text-align:center}
.stp .btn{padding:8px 12px}
.tag{display:inline-block;font-weight:800}.tag.g{color:#2f7a2a}.tag.w{color:#b7791f}.tag.r{color:#c0392b}
.card{background:#fff;border-radius:16px;padding:10px 14px;margin-top:8px}.card h3{font:600 18px Fredoka,sans-serif;margin:2px 0 6px}.card p{margin:4px 0 8px}
.meter{height:12px;border-radius:6px;background:#e6e2d3;overflow:hidden}.meter i{display:block;height:100%;border-radius:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0;font-size:14px}.kv dt{color:#4b6352}.kv dd{margin:0;font-weight:800;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.seg button{border:2px solid #c4d6b0;background:#fff;border-radius:20px;padding:6px 12px;min-height:40px;font:800 14px Nunito,sans-serif;cursor:pointer}.seg button[aria-pressed=true]{background:#2f7a2a;border-color:#2f7a2a;color:#fff}
.hrs{display:grid;grid-template-columns:auto auto;gap:8px 14px;align-items:center;justify-content:start}
.note{background:#fff;border-left:5px solid #e0a21b;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}.note.g{border-color:#2f9e44}.note.r{border-color:#d2452b}.note small{display:block;color:#4b6352;font-size:12px;margin-bottom:2px}
.keys b{font:700 15px Fredoka,sans-serif;color:#c92468}
</style>
</head>
<body>
<div id="game">
<canvas id="cv" aria-label="Mundo do jogo"></canvas>
<div class="hud" id="hud"></div>
<div class="hint" id="hint" role="status"></div>
<button id="act" disabled>…</button>
<button id="menu" aria-label="Gestão"><span>📋</span>Gestão</button>
<div class="fade" id="fade"></div>
<div id="layer"></div>
</div>
<script>
{
const TS=32,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const cv=$('#cv');let c=cv.getContext('2d'),SPRV=0;
const Y=y=>y;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MIX=new Map();
function mix(a,b,t){const k=a+b+t;if(MIX.has(k))return MIX.get(k);const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b),r='#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');MIX.set(k,r);return r}

function E(x,y,rx,ry,r,f){c.beginPath();c.ellipse(x,y,rx,ry,r,0,TAU);c.fillStyle=f;c.fill()}
function O(x,y,r,f){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=f;c.fill()}
function RR(x,y,w,h,r,f){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fillStyle=f;c.fill()}
function L(x1,y1,x2,y2,s,w){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=s;c.lineWidth=w;c.stroke()}

/* ---------- plants ---------- */
const PLM={"petunia_0": [98, 104, 42.2, 87.0], "petunia_1": [110, 132, 52.0, 115.0], "petunia_2": [142, 153, 64.7, 135.0], "lavanda_0": [98, 111, 41.8, 93.0], "lavanda_1": [104, 138, 45.9, 120.0], "lavanda_2": [138, 161, 59.9, 143.0], "suculenta_0": [95, 102, 41.4, 84.5], "suculenta_1": [102, 128, 43.0, 110.5], "suculenta_2": [133, 142, 61.6, 123.5], "orquidea_0": [95, 106, 41.6, 87.5], "orquidea_1": [122, 131, 54.5, 113.0], "orquidea_2": [132, 169, 57.3, 150.5], "monstera_0": [94, 122, 38.4, 104.0], "monstera_1": [102, 145, 45.3, 127.0], "monstera_2": [138, 180, 57.8, 162.5], "oliveira_0": [92, 126, 38.6, 107.5], "oliveira_1": [106, 156, 53.6, 138.0], "oliveira_2": [140, 189, 61.3, 170.5], "vazio": [94, 100, 40.9, 83.5]};const PLI={};
Object.keys(PLM).forEach(k=>{const im=new Image();im.src='sprites/pl_'+k+'.png';PLI[k]=im});
function pAt(sp,stage,x,base,rim){const k=sp?sp+'_'+stage:'vazio',im=PLI[k];if(!im||!im.complete||!im.naturalWidth)return;const[w,h,ax,ay]=PLM[k],f=rim/74;c.drawImage(im,x-ax*f,base-ay*f,w*f,h*f)}
function plantAt(p,x,base,size){const st=p.age>=99?2:(p.stage??2);pAt(p.sp,st,x,base,size*.46)}
/* ---------- jardineiro: cut-out puppet from the user's drawings ---------- */
const RIG_META={"front_head":[585,516],"front_torso":[351,447],"front_armL":[193,365],"front_armR":[190,365],"front_legL":[201,418],"front_legR":[204,416],"front_can":[519,360],"back_head":[554,532],"back_torso":[328,451],"back_armL":[196,368],"back_armR":[197,368],"back_legL":[205,421],"back_legR":[204,421],"side_head":[647,611],"side_torso":[355,549],"side_arm":[168,443],"side_leg":[272,508],"side_arm_dk":[168,443],"side_leg_dk":[272,508]};
const RIG_IMG={};let RIG_OK=0;
function rigLoad(){const ks=Object.keys(RIG_META);ks.forEach(k=>{const im=new Image();im.onload=()=>{if(++RIG_OK===ks.length)SPRV++};im.src='sprites/'+k+'.png';RIG_IMG[k]=im})}
const rigReady=()=>RIG_OK===Object.keys(RIG_META).length;
function part(k,px,py,x,y,rot,sx,sy){const[w,h]=RIG_META[k];c.save();c.translate(x,y);if(rot)c.rotate(rot);if(sx||sy)c.scale(sx||1,sy||1);c.drawImage(RIG_IMG[k],-px,-py,w,h);c.restore()}
function rigCarry(it,x,y,flip){
  if(!it)return;
  if(it.kind==='can'){c.save();c.translate(x,y);if(flip)c.scale(-1,1);part('front_can',150,60,0,0,0,.62,.62);c.restore();return}
  if(it.kind==='plant'&&it.p){c.save();c.translate(x,y);c.scale(20,20);plantAt(it.p,0,8,21);c.restore();return}
  c.save();c.translate(x,y);c.scale(18,18);
  if(it.kind==='spray'){RR(-2.2,-6,4.4,9,1.2,'#f4f6f1');RR(-1.4,-8.5,2.8,2.8,1,'#2f9e44')}
  else if(it.kind==='sack'){RR(-5.5,-6,11,11,3,'#9b7449')}
  else if(it.kind==='tray'){RR(-8,-2,16,5,1.5,'#2c2c2c');[-5,0,5].forEach(x=>{L(x,-2,x,-5,'#4f9a3a',1.2);O(x,-5.5,1.6,'#6fbf4a')})}
  c.restore();
}
function drawRig(w){
  const dx=Math.cos(w.dir),dy=Math.sin(w.dir),f=Math.abs(dy)>=Math.abs(dx)*.8?(dy>0?'d':'u'):(dx>0?'r':'l');
  const mv=w.moving?1:0,ph=w.walk*.23,s1=Math.sin(ph)*mv,bob=Math.abs(Math.sin(ph))*mv,t=performance.now()/1000,breath=1+Math.sin(t*2.2+w.x)*.015;
  const S0=52/1141,sc=S0*(w.sc||1);
  c.save();c.translate(w.x,Y(w.y));
  E(0,0,11*(w.sc||1),4*(w.sc||1),0,'rgba(0,0,0,.24)');
  c.scale(sc,sc);c.translate(0,-bob*26);
  const carry=w.carry,watering=w.anim==='water';
  if(f==='d'||f==='u'){
    const v=f==='d'?'front':'back',lift=a=>-Math.max(0,a)*46;
    part(v+'_legL',100,35,-62,-383+lift(s1),s1*.08,1,1);
    part(v+'_legR',102,35,62,-383+lift(-s1),-s1*.08,1,1);
    const can=carry&&carry.kind==='can',aL=carry&&!can?-.45:.12*s1+.04,aR=can?.3:carry?.45:.12*s1-.04;
    part(v+'_armL',RIG_META[v+'_armL'][0]*.62,32,-150,-602,aL,1,1);
    part(v+'_armR',RIG_META[v+'_armR'][0]*.38,32,150,-602,aR,1,1);
    if(f==='u')rigCarry(carry,can?60:0,can?-330:-430,false);
    const[tw,th]=RIG_META[v+'_torso'];part(v+'_torso',tw/2,th,0,-268,0,1,breath);
    if(f==='d')rigCarry(carry,can?60:0,can?-300:-400,false);
    const[hw,hh_]=RIG_META[v+'_head'];part(v+'_head',hw/2,hh_,0,-268-th*breath+(f==='d'?95:75),Math.sin(t*1.7+w.y)*.02*(1-mv),1,1);
  }else{
    if(f==='l')c.scale(-1,1);
    c.scale(.83,.83);
    const A=.5*s1,armR=watering?-1.25:carry?-.9:-.55*s1;
    part('side_arm_dk',84,34,-8,-760,.55*s1,1,1);
    part('side_leg_dk',92,40,-10,-468,-A,1,1);
    part('side_leg',92,40,12,-468,A,1,1);
    const[tw,th]=RIG_META.side_torso;part('side_torso',tw*.5,th,0,-318,0,1,breath);
    const[hw,hh_]=RIG_META.side_head;part('side_head',hw*.52,hh_,10,-318-th*breath+120,Math.sin(t*1.7+w.y)*.02*(1-mv),1,1);
    part('side_arm',84,34,22,-760,armR,1,1);
    if(carry){const ax=22+Math.sin(-armR)*370,ay=-760+Math.cos(armR)*370;rigCarry(carry,ax+(carry.kind==='can'?40:0),ay+(carry.kind==='can'?-20:-30),false)}
  }
  c.restore();
}

function person(w){
  if(w.look&&w.look.rig&&rigReady()){drawRig(w);return}
  const lk=w.look,dx=Math.cos(w.dir),dy=Math.sin(w.dir),f=Math.abs(dy)>=Math.abs(dx)?(dy>0?'d':'u'):(dx>0?'r':'l'),s=f==='l'?-1:1;
  const ph=w.moving?Math.sin(w.walk*.3):0,pants=lk.pants||'#3d4a5c',sh=lk.shirt,dk=mix(sh,'#000000',.25);
  c.save();c.translate(w.x,Y(w.y));if(w.sc)c.scale(w.sc,w.sc);
  E(0,0,9.5,3.6,0,'rgba(0,0,0,.24)');
  if(f==='d'||f==='u'){RR(-5,-12-Math.max(0,ph)*2,4.4,12,1.6,pants);RR(.6,-12-Math.max(0,-ph)*2,4.4,12,1.6,pants);E(-2.8,-.6-Math.max(0,ph)*2,2.9,1.6,0,'#2b2320');E(2.8,-.6-Math.max(0,-ph)*2,2.9,1.6,0,'#2b2320')}
  else{RR(-2.2-ph*3,-12,4.4,12,1.6,mix(pants,'#000000',.25));RR(-2.2+ph*3,-12,4.4,12,1.6,pants);E(-ph*3+1.5*s,-.6,2.9,1.6,0,'#2b2320');E(ph*3+1.5*s,-.6,2.9,1.6,0,'#2b2320')}
  const carry=()=>{const it=w.carry;if(!it)return;
    if(it.kind==='plant'&&it.p)plantAt(it.p,0,-9,21);
    else if(it.kind==='can'){RR(-4,-21,9,8,2,'#4f86ad');L(4,-19,9,-23,'#4f86ad',2);c.beginPath();c.arc(0,-21,3,Math.PI,0);c.strokeStyle='#3c6a8a';c.lineWidth=1.3;c.stroke()}
    else if(it.kind==='spray'){RR(-2.2,-23,4.4,9,1.2,'#f4f6f1');RR(-1.4,-25.5,2.8,2.8,1,'#2f9e44')}
    else if(it.kind==='sack'){RR(-5.5,-23,11,11,3,'#9b7449');L(-3,-18,3,-18,'#6e5030',1)}
    else if(it.kind==='tray'){RR(-8,-19,16,5,1.5,'#2c2c2c');[-5,0,5].forEach(x=>{L(x,-19,x,-22,'#4f9a3a',1.2);O(x,-22.5,1.6,'#6fbf4a')})}};
  if(f==='u')carry();
  if(f==='d'||f==='u'){const a=w.carry&&f==='d';RR(-10.2,-25+(a?0:ph*1.5),3.8,a?8:11,1.9,dk);RR(6.4,-25-(a?0:ph*1.5),3.8,a?8:11,1.9,dk)}
  RR(-7.5,-27,15,16,5.5,sh);RR(2.6,-26,4.2,14,3,dk);RR(-6,-26,3,10,2,mix(sh,'#ffffff',.18));
  if(lk.apron){RR(-5.5,-22,11,11,2.5,lk.apron);L(-4,-27,-4,-22,lk.apron,1.4);L(4,-27,4,-22,lk.apron,1.4)}
  if(f==='l'||f==='r')RR(-1.9+(w.carry?3*s:ph*3*s),-25,3.8,w.carry?7:11,1.9,dk);
  O(0,-33,6.7,lk.skin);
  if(f==='u')O(0,-33.5,6.9,lk.hair);
  else if(f==='d'){c.beginPath();c.arc(0,-33.6,7,Math.PI*1.02,Math.PI*1.98);c.fillStyle=lk.hair;c.fill();RR(-6.6,-37.5,13.2,3,1.5,lk.hair);O(-2.4,-32.2,1,'#2b2320');O(2.4,-32.2,1,'#2b2320');E(0,-29.4,1.8,.8,0,mix(lk.skin,'#b3474b',.35))}
  else{c.beginPath();c.arc(0,-33.6,7,s>0?Math.PI*.55:-Math.PI*.45,s>0?Math.PI*1.95:Math.PI*.95);c.fillStyle=lk.hair;c.fill();O(3.2*s,-32.6,1,'#2b2320')}
  if(lk.hat){E(0,-37.5,11.5,4.2,0,'#d8b356');E(0,-38.2,11,3.7,0,'#e8c66a');RR(-5.6,-45,11.2,8.5,3.5,'#efd27e');RR(-5.6,-40.4,11.2,2.2,1,'#8a6a2a')}
  else if(lk.cap){c.beginPath();c.arc(0,-34.5,7.1,Math.PI,0);c.fillStyle=lk.cap;c.fill();if(f==='d')E(0,-34,6.5,2.2,0,mix(lk.cap,'#000000',.3));else if(f!=='u')E(5.5*s,-35,5,1.9,0,mix(lk.cap,'#000000',.3))}
  if(f!=='u')carry();
  c.restore();
  if(w.label){c.font='800 11px Nunito,sans-serif';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#fff';c.strokeText(w.label,w.x,Y(w.y)-50);c.fillStyle='#c92468';c.fillText(w.label,w.x,Y(w.y)-50)}
}

  if(G.staff.caixa){const open=(G.close-G.open)/24,n=Math.min(40,Math.floor(el*open/Math.max(6,15-G.sat*.09)));
    for(let k=0;k<n;k++){let f=G.shop.map((s,i)=>s&&slotOn(i)?i:-1).filter(i=>i>=0);
      if(!f.length&&G.staff.repos){const sp=KEYS.find(s=>G.inv[s]>0);const e=G.shop.findIndex((s,i)=>!s&&slotOn(i));if(sp&&e>=0){G.inv[sp]--;G.shop[e]={sp};r.restock++;f=[e]}}
      if(!f.length)break;const i=pick(f),sp=G.shop[i].sp;if(Math.random()<buyChance(sp)){G.shop[i]=null;const v=price(sp);G.money+=v;G.earned+=v;G.sold++;r.sold++;r.rev+=v}}}
  if(r.harv||r.sold||el>600)openSheet('away',r);save()}
/* staff walkers */
let crew={};
const STOCK={x:20.4*TS,y:4.15*TS},TOP=4.15*TS,NHOME={x:14.2*TS,y:29.75*TS};
function mkStaff(s){const home=s.k==='caixa'?{x:CNT.a.x,y:CNT.a.y}:s.k==='repos'?{...STOCK}:{...NHOME};return walker({x:home.x,y:home.y,home,speed:66,staff:s.k,sc:s.k==='jard'?'out':'shop',label:s.n,look:{shirt:s.shirt,apron:'#2f7a2a',hair:pick(HAIR),skin:pick(SKIN),pants:'#3d4a5c'},t:1,job:null,dir:Math.PI/2})}
function syncStaff(){STAFF.forEach(s=>{if(G.staff[s.k]&&!crew[s.k])crew[s.k]=mkStaff(s);if(!G.staff[s.k])delete crew[s.k]})}
function stockCount(sp){return(G.inv[sp]||0)+G.shop.filter(s=>s&&s.sp===sp).length+G.pots.filter(p=>p&&p.sp===sp).length}
function staffStep(dt){const on=isOpen();
  for(const k in crew){const w=crew[k];
    if(!on){if(!w.away&&w.job&&w.job.sp&&k==='repos')G.inv[w.job.sp]=(G.inv[w.job.sp]||0)+1;w.away=true;w.path=[];w.job=null;w.carry=null;w.x=w.home.x;w.y=w.home.y;continue}
    w.away=false;const done=moveAlong(w,dt);
    if(k==='caixa'){if(done)w.dir=Math.PI/2;const q=custs.find(c=>c.st==='wait');if(q){w.t-=dt;w.bubble=w.t<.8?null:null;if(w.t<=0){w.t=1.8;cobrar(w.label)}}else w.t=1.8}
    else if(k==='repos'){
      if(w.job){if(done){w.t-=dt;if(w.t<=0){const j=w.job,s=SLOTS[j.i];
        if(j.ph===0){if(!G.shop[j.i]&&slotOn(j.i)){G.shop[j.i]={sp:j.sp};floats.push({x:s.x,y:s.y-30,t:0,txt:SP[j.sp].n+' à venda'})}else G.inv[j.sp]=(G.inv[j.sp]||0)+1;w.carry=null;j.ph=1;j.sp=null;w.path=[{x:s.cx,y:TOP},{...w.home}];w.t=0}
        else{w.job=null;w.t=1.2}}}}
      else{w.t-=dt;if(w.t<=0){w.t=1.5;const free=SLOTS.map((s,i)=>i).filter(i=>slotOn(i)&&!G.shop[i]);const own=KEYS.filter(s=>G.inv[s]>0);
        if(free.length&&own.length){const i=free[0],sp=own.sort((a,b)=>G.inv[b]-G.inv[a])[0],s=SLOTS[i];G.inv[sp]--;w.carry={kind:'plant',p:{sp,stage:2,age:99}};w.job={i,sp,ph:0};w.path=[{x:s.cx,y:TOP},{x:s.cx,y:s.sy}];w.t=.6}
        else if(free.length>=4)notify('repos','stock','O stock acabou e há mesas vazias. Colhe no viveiro ou compra ao fornecedor.')}}}
    else if(k==='jard'){
      if(w.job){const j=w.job;if(done){if(j.ph===0){w.dir=Math.PI/2;w.t-=dt;if(scene==='out'&&(j.k===3||j.k===4)&&Math.random()<.6){const p=POTS[j.i];parts.push({x:w.x,y:w.y-22,vx:(p.x-w.x)*2.2,vy:(p.y-26-w.y+22)*2.2+20,life:.4,col:j.k===4?'#7bc96f':'#3b9be0'})}
          if(w.t<=0){const p=G.pots[j.i];
            if(j.k===4&&p){p.pest=0;G.money-=1}
            else if(j.k===3&&p)p.w=100;
            else if(j.k===2&&p&&p.g>=1){G.inv[p.sp]=(G.inv[p.sp]||0)+1;G.pots[j.i]=null;w.carry={kind:'plant',p:{sp:p.sp,stage:2,age:99}};if(scene==='out')floats.push({x:POTS[j.i].x,y:POTS[j.i].y-30,t:0,txt:'+1 '+SP[p.sp].n})}
            else if(j.k===1&&!p){const ok=KEYS.filter(s=>G.money>=SP[s].seed).sort((a,b)=>stockCount(a)-stockCount(b));if(ok.length){const sp=ok[0];G.money-=SP[sp].seed;G.pots[j.i]={sp,g:0,w:100}}}
            if(j.k!==2)w.carry=null;j.ph=1;w.path=[{x:w.home.x,y:j.row},{...w.home}]}}
        else{w.job=null;w.carry=null;w.t=.8}}}
      else{w.t-=dt;if(w.t<=0){w.t=1.2;let best=-1,pr=0;const cheap=Math.min(...KEYS.map(s=>SP[s].seed));
        G.pots.forEach((p,i)=>{if(!potOn(i))return;let v=0;if(!p)v=G.money>=cheap?1:0;else if(p.pest)v=4;else if(p.w<50)v=3;else if(p.g>=1)v=2;if(v>pr){pr=v;best=i}});
        if(best<0&&G.pots.some((p,i)=>potOn(i)&&!p))notify('jard','seed','Não há dinheiro para sementes. Vende plantas ou pede crédito no banco.');
        if(best>=0){const p=POTS[best],row=best<8?27.15*TS:29.85*TS;w.job={i:best,ph:0,k:pr,row};w.carry=pr===3?{kind:'can'}:null;w.path=[{x:w.home.x,y:row},{x:p.x,y:row}];w.t=pr===1?.7:1}}}}
  }}
/* staff warnings without anyone asking */
let warnT=8;
function warnings(dt){warnT-=dt;if(warnT>0)return;warnT=10;
  if(!G.staff.jard){const th=G.pots.filter((p,i)=>p&&potOn(i)&&p.w<20&&p.g<1).length,pe=G.pots.filter((p,i)=>p&&potOn(i)&&p.pest).length;
    if(pe)notify('Viveiro','pest',`${pe} vaso${pe>1?'s têm':' tem'} pragas. Vai tratar ou contrata uma jardineira.`);
    else if(th>=2)notify('Viveiro','dry',`${th} plantas estão a secar no viveiro.`)}
  if(isOpen()&&!G.staff.caixa&&custs.filter(c=>c.st==='wait').length>=2&&scene!=='shop')notify('Loja','queue','Há clientes à espera na caixa. Vai cobrar ou contrata a Ana.')}
/* ---------- gestão: janela com separadores ---------- */
const TABS=[['team','👥','Equipa'],['price','🏷️','Preços'],['sup','🚚','Fornecedor'],['bank','🏦','Banco'],['shop','🏪','Loja'],['news','🔔','Avisos']];
let UI={tab:'team',lamt:250,ldays:10};
function gestHTML(){const t=UI.tab;let h='';
  if(t==='team'){h=`<p>Salários pagos à meia-noite: <b>${fmt(wages())}</b> por dia. A equipa trabalha das ${hh(G.open)} às ${hh(G.close)}.</p>`+STAFF.map(s=>`<div class="row"><span class="av" style="background:${s.shirt}">${s.n[0]}</span><span><b>${s.n} · ${s.r}</b><small>${s.d}</small></span>${G.staff[s.k]?`<button class="btn alt" data-x="fire" data-s="${s.k}">Despedir</button>`:`<button class="btn" data-x="hire" data-s="${s.k}">Contratar<br><small style="color:#fff">${fmt(s.w)}/dia</small></button>`}</div>`).join('')}
  if(t==='price'){h=`<p>O preço de referência é o que os clientes acham justo. Mais caro dá mais lucro por planta, mas vendes menos e a satisfação desce.</p>`+KEYS.map(s=>{const[tg,col]=priceTag(s);return`<div class="row"><img src="sprites/pl_${s}_2.png" alt=""><span><b>${SP[s].n}</b><small>Semente ${fmt(SP[s].seed)} · lucro ${fmt(price(s)-SP[s].seed)} · fornecedor ${fmt(WS(s))} · lucro ${fmt(price(s)-WS(s))}</small><small class="tag ${col}">${tg} · referência ${fmt(SP[s].price)} · compram ${Math.round(buyChance(s)*100)}%</small></span><span class="stp"><button data-x="pr" data-s="${s}" data-d="-1" aria-label="Baixar">−</button><b>${fmt(price(s))}</b><button data-x="pr" data-s="${s}" data-d="1" aria-label="Subir">+</button></span></div>`}).join('')}
  if(t==='sup'){h=`<p>Compra plantas prontas ao produtor. Chegam ao teu stock e depois pões nas mesas (ou o Rui põe).</p>`+KEYS.map(s=>`<div class="row"><img src="sprites/pl_${s}_2.png" alt=""><span><b>${SP[s].n}</b><small>Custa ${fmt(WS(s))} · vendes a ${fmt(price(s))} · tens ${G.inv[s]||0}</small></span><span class="stp"><button class="btn" data-x="buy" data-s="${s}" data-n="1" ${G.money<WS(s)?'disabled':''}>+1</button><button class="btn" data-x="buy" data-s="${s}" data-n="5" ${G.money<WS(s)*5?'disabled':''}>+5</button></span></div>`).join('')}
  if(t==='bank'){const sc=score(),rt=rating(sc),lim=limit(),b=G.bank,amt=Math.min(UI.lamt,lim),tm=loanTerms(amt,UI.ldays);
    h=`<div class="card"><h3>Análise de crédito</h3><div class="meter"><i style="width:${(sc-300)/6}%;background:${rt.c}"></i></div><p><b>${sc}</b> · ${rt.n}</p><dl class="kv"><dt>Pagamentos a tempo</dt><dd>${b.ok}</dd><dt>Prestações falhadas</dt><dd>${b.miss}</dd><dt>Empréstimos pagos</dt><dd>${b.paid}</dd><dt>Faturação média</dt><dd>${fmt(avgRev())}/dia</dd><dt>Satisfação</dt><dd>${Math.round(G.sat)}%</dd><dt>Dívida</dt><dd>${fmt(debt())}</dd></dl></div>`;
    if(sc<450||lim<50)h+=`<div class="card"><h3>Sem crédito por agora</h3><p>${sc<450?'A tua nota está abaixo de 450.':'Já usaste o teu limite.'} Paga o que deves e vende mais para teres crédito.</p></div>`;
    else{const opts=[...new Set([100,250,500,1000,2000].filter(v=>v<lim).concat(lim))];
      h+=`<div class="card"><h3>Pedir empréstimo</h3><p>Até <b>${fmt(lim)}</b>. Juro ${Math.round(rt.r*100)}% (20 dias: +3%). A prestação é cobrada à meia-noite.</p><div class="seg">${opts.map(v=>`<button data-x="lamt" data-n="${v}" aria-pressed="${amt===v}">${fmt(v)}</button>`).join('')}</div><div class="seg">${[10,20].map(v=>`<button data-x="ldays" data-n="${v}" aria-pressed="${UI.ldays===v}">${v} dias</button>`).join('')}</div><dl class="kv"><dt>Recebes agora</dt><dd>${fmt(amt)}</dd><dt>Total a pagar</dt><dd>${fmt(tm.total)}</dd><dt>Prestação</dt><dd>${fmt(tm.inst)}/dia · ${UI.ldays} dias</dd></dl><button class="btn" data-x="loan">Pedir ${fmt(amt)}</button></div>`}
    h+=b.loans.map(l=>`<div class="card"><h3>Empréstimo de ${fmt(l.amount)}</h3><p>Falta ${fmt(l.left)} · ${fmt(l.inst)}/dia</p><button class="btn alt" data-x="payoff" data-n="${l.id}" ${G.money<l.left?'disabled':''}>Pagar tudo · ${fmt(l.left)}</button></div>`).join('')}
  if(t==='shop'){const s=Math.round(G.sat),face=s>=75?'😄':s>=50?'🙂':s>=30?'😐':'😠';
    h=`<div class="card"><h3>Satisfação ${face} ${s}%</h3><div class="meter"><i style="width:${s}%;background:${s>=50?'#2f9e44':s>=30?'#e0a21b':'#d2452b'}"></i></div><p>Sobe quando cobras depressa e os preços são justos. Desce com filas longas, mesas vazias e preços caros. Mais satisfação traz mais clientes e melhor crédito.</p></div>
    <div class="card"><h3>Horário · agora ${hh(nowH())} ${isOpen()?'<span class="tag g">aberta</span>':'<span class="tag r">fechada</span>'}</h3><div class="hrs"><span>Abre</span><span class="stp"><button data-x="hr" data-s="open" data-d="-1">−</button><b>${hh(G.open)}</b><button data-x="hr" data-s="open" data-d="1">+</button></span><span>Fecha</span><span class="stp"><button data-x="hr" data-s="close" data-d="-1">−</button><b>${hh(G.close)}</b><button data-x="hr" data-s="close" data-d="1">+</button></span></div></div>
    <div class="card"><h3>Crescer</h3>${G.tables<3?`<div class="row"><span class="av" style="background:#deaa68">🪑</span><span><b>Terceira mesa na loja</b><small>Mais 8 lugares para plantas</small></span><button class="btn" data-x="xtable" ${G.money<300?'disabled':''}>€300</button></div>`:'<p>A loja tem as 3 mesas.</p>'}${G.benches<2?`<div class="row"><span class="av" style="background:#d19b5c">🌱</span><span><b>Segunda bancada no viveiro</b><small>Mais 8 vasos para cultivar</small></span><button class="btn" data-x="xbench" ${G.money<200?'disabled':''}>€200</button></div>`:'<p>O viveiro tem as 2 bancadas.</p>'}</div>
    <dl class="kv"><dt>Plantas vendidas</dt><dd>${G.sold}</dd><dt>Faturado no total</dt><dd>${fmt(G.earned)}</dd></dl>`}
  if(t==='news'){G.unread=0;badge();h=G.alerts.length?G.alerts.map(a=>`<div class="note ${a.lvl}"><small>${new Date(a.t).toLocaleString('pt-PT',{weekday:'short',hour:'2-digit',minute:'2-digit'})} · ${a.who}</small>${a.msg}</div>`).join(''):'<p>Sem avisos. A equipa avisa-te aqui do que faltar.</p>'}
  return`<div class="back" data-x="close"><div class="sheet wide" data-x="noop"><div class="tabs">${TABS.map(([k,i,l])=>`<button data-x="tab" data-s="${k}" aria-pressed="${t===k}"><span>${i}</span>${l}${k==='news'&&G.unread?`<em>${G.unread}</em>`:''}</button>`).join('')}<button data-x="close" aria-label="Fechar">✕</button></div><div class="money">Saldo <b>${fmt(G.money)}</b></div>${h}</div></div>`}
function gestAct(x,b){const s=b.dataset.s,n=+b.dataset.n,d=+b.dataset.d;
  if(x==='tab')UI.tab=s;
  if(x==='hire'){G.staff[s]=1;syncStaff();const st=STAFF.find(q=>q.k===s);toast(`${st.n} contratada: ${fmt(st.w)} por dia`.replace('Rui contratada','Rui contratado'))}
  if(x==='fire'){G.staff[s]=0;if(s==='repos'&&crew.repos&&crew.repos.job&&crew.repos.job.sp)G.inv[crew.repos.job.sp]=(G.inv[crew.repos.job.sp]||0)+1;syncStaff()}
  if(x==='pr')G.price[s]=clamp(price(s)+d,1,SP[s].price*3);
  if(x==='buy'){const c=WS(s)*n;if(G.money<c)return toast('Não tens dinheiro suficiente');G.money-=c;G.inv[s]=(G.inv[s]||0)+n;toast(`+${n} ${SP[s].n} no stock`)}
  if(x==='lamt')UI.lamt=n;if(x==='ldays')UI.ldays=n;
  if(x==='loan'){const lim=limit(),a=Math.min(UI.lamt,lim);if(a<50)return;const tm=loanTerms(a,UI.ldays);G.bank.loans.push({id:Date.now(),amount:a,left:tm.total,inst:tm.inst});G.money+=a;toast(`Banco aprovou ${fmt(a)}`)}
  if(x==='payoff'){const l=G.bank.loans.find(q=>q.id===n);if(l&&G.money>=l.left){G.money-=l.left;l.left=0;G.bank.paid++;G.bank.loans=G.bank.loans.filter(q=>q.left>0)}}
  if(x==='hr'){if(s==='open')G.open=clamp(G.open+d,5,12);else G.close=clamp(G.close+d,16,23)}
  if(x==='xtable'&&G.money>=300){G.money-=300;G.tables=3;toast('Nova mesa na loja!')}
  if(x==='xbench'&&G.money>=200){G.money-=200;G.benches=2;toast('Nova bancada no viveiro!')}
  save();hud();$('#layer').innerHTML=gestHTML()}

/* ---------- loop ---------- */
let last=0,hudT=0,saveT=0,lastNear='',dayT=2;
function loop(t){requestAnimationFrame(loop);try{step(t)}catch(e){console.error(e)}}
function step(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  playerStep(dt);potsTick(dt);outsideLife(dt);staffStep(dt);warnings(dt);
  custT-=dt;if(custT<=0){custT=Math.max(5,15-G.sat*.09)*(.7+Math.random()*.6);if(isOpen()&&Math.random()<.55)spawnCust()}
  dayT-=dt;if(dayT<=0){dayT=20;newDay()}
  custs.forEach(w=>custStep(w,dt));custs=custs.filter(w=>!w.gone);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.4);
  near=findNear();const key=near?near.label+near.hint:'';
  if(key!==lastNear){lastNear=key;const b=$('#act');b.textContent=near?near.label:'…';b.disabled=!near||near.t==='none';$('#hint').textContent=near?near.hint:''}
  hudT-=dt;if(hudT<=0){hudT=.5;hud()}
  saveT-=dt;if(saveT<=0){saveT=3;G.px=P.x;G.py=P.y;G.lastT=Date.now();save()}
  render();
}
rigLoad();syncStaff();newDay();hud();badge();if(G.help)openSheet('help');else catchUp();requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden){G.lastT=Date.now();save()}else{newDay();catchUp();hud()}});
function goLand(){try{const d=document.documentElement;if(matchMedia('(pointer:coarse)').matches&&d.requestFullscreen&&!document.fullscreenElement)d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}}
window.DBG=()=>({P,custs,S2:TS,spawnCust,G,crew,isOpen,nowH,catchUp,newDay,score,limit,syncStaff,setG:v=>{G=v}});
}
</script>
