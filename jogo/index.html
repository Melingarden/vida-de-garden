<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida de Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a cheerful little management game, warm and tidy
   IDEA a dollhouse view from above: a real garden-centre floor with tables, a counter and the street; a real greenhouse with benches and a van
   PICTURE the live top-down map: plants on tables, staff walking to water, customers coming in from the street
   COLOUR leaf greens lead, terracotta pots support, petunia magenta accent, water blue for water only
   TYPE Fredoka (rounded, garden-label feel) + Nunito
   LAYOUT HUD strip; map left and panels right on a laptop; on a phone the map first, then the tabs; sticky day bar */
:root{color-scheme:light dark;--bg:#e3eed3;--ink:#13281c;--card:#ffffff;--line:#c4d6b0;--muted:#4b6352;--leaf:#2f7a2a;--pink:#c92468;--water:#2378c2;--warn:#b8321c;--amberA:#b07400;--amberB:#8a5a00;--amberC:#f2b134}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f2219;--ink:#e6f1dc;--card:#18332a;--line:#2b4a3c;--muted:#a8bfa9;--leaf:#7cc35a;--pink:#ff5c9b;--water:#5fb0f0;--warn:#ff7a5c;--amberA:#f2b134;--amberB:#f2b134}}
:root[data-theme=dark]{--bg:#0f2219;--ink:#e6f1dc;--card:#18332a;--line:#2b4a3c;--muted:#a8bfa9;--leaf:#7cc35a;--pink:#ff5c9b;--water:#5fb0f0;--warn:#ff7a5c;--amberA:#f2b134;--amberB:#f2b134}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;letter-spacing:-.01em;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,3vw)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#start{padding-block:clamp(24px,5vw,56px)}
#start h1{font-size:clamp(38px,7vw,60px);color:var(--leaf)}
#start p.lead{font-size:17px;max-width:46ch;margin:10px 0 24px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.role{all:unset;cursor:pointer;display:grid;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .15s,border-color .15s}
.role:hover,.role:focus-visible{border-color:var(--leaf);transform:translateY(-3px)}
.role:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.role canvas{display:block;width:100%;aspect-ratio:16/9}
.role .txt{padding:16px 18px 20px}
.role h2{font-size:28px}
.role p{margin:6px 0 0;color:var(--muted)}
.role .go{display:inline-block;margin-top:12px;font-weight:800;color:var(--pink)}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:8px}
.hud .who{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;margin-right:auto}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-family:Fredoka,sans-serif;font-size:19px;white-space:nowrap}
.stat span{font-size:13px;color:var(--muted);white-space:nowrap}
.meta{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meta .track{flex:1;height:7px;border-radius:8px;background:var(--line);overflow:hidden}
.meta .track i{display:block;height:100%;background:var(--leaf);border-radius:8px}
.play{padding-top:12px}
@media(min-width:900px){.play{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}.mapcol{position:sticky;top:76px}}
.tip{margin:0 0 10px;font-size:15px;padding:9px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tip b{color:var(--pink)}
#map{display:block;width:100%;max-width:100%;aspect-ratio:400/467;margin:0 auto;border-radius:20px;touch-action:manipulation;box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;padding-bottom:2px}
@media(min-width:900px){.tabs{margin-top:0}#map{max-width:min(100%,calc((100svh - 250px) * var(--mr,.857)))}}
.tabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:30px;padding:8px 16px;min-height:44px;font-weight:800}
.tabs button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px;padding-bottom:110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 12px;align-items:center}
.card .spr{width:60px}
.card h3{font-size:18px}
.card p{margin:2px 0;font-size:14px;color:var(--muted)}
.card .row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.spr{display:block;aspect-ratio:1}
.price{font-family:Fredoka,sans-serif;font-size:20px;white-space:nowrap}
.hot{color:var(--pink);font-weight:800}
.cold{color:var(--muted);font-weight:800}
.btn{border:0;border-radius:30px;padding:10px 18px;min-height:44px;font-weight:800;background:var(--leaf);color:var(--bg)}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.seg{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:800}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:30px;padding:6px 14px;min-height:44px;font-weight:800}
.seg button[aria-pressed=true]{border-color:var(--pink);color:var(--pink)}.seg button:disabled{opacity:.4}
.note{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0 0 4px}
.daybar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.daybar .wrap{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.daybar .st{margin-right:auto;font-weight:800}
.daybar .btn{font-size:17px}
.back{position:fixed;inset:0;z-index:10;background:rgba(5,20,12,.5);display:grid;align-items:end;justify-items:center}
@media(min-width:700px){.back{align-items:center}}
.sheet{background:var(--bg);width:min(100%,560px);max-height:88svh;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(16px,4vw) max(20px,env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:24px}}
.sheet h2{font-size:28px;margin-bottom:6px}
.sheet .top{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.sheet .top .spr{width:110px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.list{display:grid;gap:8px;margin-top:10px}
.lrow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 10px}
.lrow .spr{width:50px}
.lrow b{display:block}.lrow small{font-size:13px;color:var(--muted)}
.rep{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:6px}
.rep li{background:var(--card);border-radius:12px;padding:8px 12px;border:1px solid var(--line);font-size:15px}
.rep li.g{border-left:5px solid var(--leaf)}.rep li.r{border-left:5px solid var(--warn)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:800;max-width:90vw;text-align:center}

.stat b.g{color:var(--leaf)}.stat b.w{color:var(--amberA)}.stat b.r{color:var(--warn)}
.clk{font-family:Fredoka,sans-serif;font-size:22px;margin-right:8px;font-variant-numeric:tabular-nums}
.daybar .st{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:14px;color:var(--muted);line-height:1.2}
.daybar .st b{color:var(--ink)}
.btn.spd{min-width:56px;padding-inline:12px}
.btn.sm{padding:6px 12px;min-height:40px;font-size:15px}
.step{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:30px;padding:3px}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:800;line-height:1}
.step b{font-family:Fredoka,sans-serif;font-size:19px;min-width:3.2ch;text-align:center;white-space:nowrap}
.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:20px;white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}.tag.w{background:color-mix(in srgb,#f2b134 25%,transparent);color:var(--amberB)}.tag.r{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.profit{font-weight:800;font-size:14px;white-space:nowrap}.profit.neg{color:var(--warn)}
.cnt{font-family:Nunito,sans-serif;font-size:14px;color:var(--muted);font-weight:800}
.meter{display:grid;grid-template-columns:8.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:4px 0}
.meter .track{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;border-radius:9px}
.meter i.g{background:var(--leaf)}.meter i.w{background:#f2b134}.meter i.r{background:var(--warn)}.meter i.b{background:var(--water)}
.meter b{white-space:nowrap}
.seg .btn{min-height:44px}

body.playing{overflow:hidden;height:100%}
.stage{position:fixed;inset:0;overflow:hidden;background:#2f3b33;touch-action:none;user-select:none;-webkit-user-select:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:0;box-shadow:none;max-width:none;aspect-ratio:auto;cursor:grab}
.top{position:absolute;z-index:3;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);color:#13281c;border-radius:999px;padding:5px 12px 5px 8px;font:800 16px/1 Nunito,sans-serif;border:0;min-height:42px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.chip svg{width:22px;height:22px;flex:none;color:#2f7a2a}
button.chip{cursor:pointer}button.chip:focus-visible,.dock button:focus-visible,.rb:focus-visible,.closeb:focus-visible{outline:3px solid #ff5c9b;outline-offset:2px}
.chip.day{padding-right:14px}.chip.day span{display:grid;line-height:1.1}.chip.day b{font:700 19px/1 Fredoka,sans-serif;font-variant-numeric:tabular-nums}.chip.day small{font-size:12px;color:#4b6352;font-weight:700}
.chip.day svg{color:#e2a31b}
.chip small.r{color:#b8321c;font-size:13px}
.chip.g svg{color:#2f9e44}.chip.w svg{color:#d39a10}.chip.r svg{color:#d2452b}
.chip.goal .gt{width:54px;height:8px;border-radius:8px;background:#dbe6cf;overflow:hidden}.chip.goal .gt i{display:block;height:100%;background:#2f7a2a}
.chip.goal svg{color:#c92468}
.tipb{position:absolute;z-index:3;left:8px;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 100px);margin:0 auto;max-width:520px;background:rgba(19,40,28,.88);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.35;cursor:pointer}
.tipb b{color:#ffb3d0}
@media(min-width:700px){.tipb{top:calc(max(8px,env(safe-area-inset-top)) + 56px);left:auto;right:12px;max-width:340px}}
.side-ctl{position:absolute;z-index:3;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));display:grid;gap:8px}
.rb{width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#13281c;display:grid;place-items:center;font:700 17px Fredoka,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.rb svg{width:22px;height:22px}.rb.water{background:#2378c2;color:#fff}.rb.paused{background:#f2b134}
.closeb{position:absolute;z-index:3;left:10px;bottom:calc(96px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#c92468;color:#fff;font:800 16px Nunito,sans-serif;padding:12px 18px;box-shadow:0 2px 10px rgba(0,0,0,.25);min-height:48px}
.closeb svg{width:20px;height:20px}
.dock{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 5px max(10px,env(safe-area-inset-bottom));background:linear-gradient(rgba(10,25,16,0),rgba(10,25,16,.6) 40%)}
.dock button{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;width:min(70px,calc((100vw - 34px)/7));min-height:60px;border:0;border-radius:16px;background:rgba(255,255,255,.95);color:#13281c;padding:6px 2px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dock svg{width:24px;height:24px;color:#2f7a2a}
.dock span{font:800 12px/1 Nunito,sans-serif;white-space:nowrap;letter-spacing:-.02em}
.dock em{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:#c92468;color:#fff;font:800 12px/20px Nunito,sans-serif;font-style:normal;padding:0 5px}
.sheet.big{max-height:80svh}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-20px;background:var(--bg);padding:6px 0 4px;z-index:1}
.sh-h h2{margin:0}
.xb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.xb svg{width:20px;height:20px}
.sheet .cards{padding-bottom:10px}
.toast{bottom:calc(170px + env(safe-area-inset-bottom))}
.rb.bell{position:relative;background:#fff}.rb.bell svg{color:#c92468}.rb em{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#c92468;color:#fff;font:800 12px/20px Nunito,sans-serif;font-style:normal;padding:0 5px}
.card.al{border-left:5px solid var(--line)}.card.al.g{border-left-color:var(--leaf)}.card.al.w{border-left-color:#f2b134}.card.al.r{border-left-color:var(--warn)}
.card.al .who{margin:0;font-size:13px}.card.al .msg{margin:2px 0;font-size:15px;color:var(--ink)}
.card .row>span:first-child{font-weight:800}
</style>
</head>
<body>
<section id="start" class="wrap">
  <h1>Vida de Garden</h1>
  <p class="lead">Escolhe o teu lado do negócio das plantas. Tudo acontece à hora real: a loja abre de manhã, fecha à noite e continua a funcionar quando não estás. Meta: €1.500 sem dívidas.</p>
  <div class="roles">
    <button class="role" data-act="role" data-arg="garden">
      <canvas id="artGarden" aria-hidden="true"></canvas>
      <span class="txt"><h2>Dono de Garden</h2><p>Compras aos produtores, defines os preços, contratas equipa e vês os clientes entrar. Se saírem contentes, voltam.</p><span class="go">Abrir a loja</span></span>
    </button>
    <button class="role" data-act="role" data-arg="prod">
      <canvas id="artProd" aria-hidden="true"></canvas>
      <span class="txt"><h2>Produtor</h2><p>A tua equipa semeia e cuida da estufa. Os gardens fazem pedidos se o teu preço e as tuas entregas forem bons.</p><span class="go">Entrar na estufa</span></span>
    </button>
  </div>
</section>
<div id="game" hidden></div>
<div id="layer"></div>
<script>
let S=null,UI={sheet:null,toast:''};
/* ================= data ================= */
const SP={
 petunia:{n:'Petúnia',g:3,seed:2,ws:9,dry:30,pk:[1.3,1.3,.8,.5]},
 lavanda:{n:'Lavanda',g:4,seed:3,ws:14,dry:15,pk:[1.1,1.4,.9,.6]},
 suculenta:{n:'Suculenta',g:5,seed:1,ws:8,dry:8,pk:[1,1,1,1]},
 orquidea:{n:'Orquídea',g:7,seed:8,ws:32,dry:18,pk:[.9,.7,1.1,1.4]},
 monstera:{n:'Monstera',g:6,seed:6,ws:26,dry:20,pk:[1,.9,1.2,1.25]},
 oliveira:{n:'Oliveira',g:9,seed:12,ws:55,dry:12,pk:[1,.8,1.4,.9]}
};
const KEYS=Object.keys(SP);
const SEAS=['Primavera','Verão','Outono','Inverno'];
const SUP=[{n:'Estufas Vale do Sado',m:.9,q:[58,82]},{n:'Viveiros Oeste Bio',m:1.15,q:[86,100]}];
const BUYERS=['Garden Flor do Tejo','Viveiro Sintra Verde','Floricultura Rosa dos Ventos','Garden Quinta do Sol','Florista Alfama','Garden Cascais Verde'];
const CLIENTS=['Casamento na Ericeira','Restaurante Maré','Escritório no Saldanha','Hotel Jardim','Batizado em Cascais','Café Estrela'];
const STAFF={
 garden:[{k:'jard',n:'Jardineiro',w:20,min:1,max:3,d:'Rega e trata as plantas. Com 2 ou mais, cuidam sozinhos das plantas com sede ou praga.'},
  {k:'caixa',n:'Caixa',w:18,min:0,max:1,d:'Segundo atendente no balcão: a fila anda duas vezes mais rápido e ninguém desiste de esperar.'},
  {k:'vend',n:'Vendedor',w:22,min:0,max:2,d:'Ajuda os clientes nas mesas: compram mais e saem mais satisfeitos.'}],
 prod:[{k:'trab',n:'Trabalhador',w:15,min:1,max:5,d:'Semeia, rega, trata e carrega a carrinha. Com 3 ou mais, cuidam sozinhos das plantas com sede ou praga.'},
  {k:'com',n:'Comercial',w:25,min:0,max:2,d:'Visita os gardens da zona e traz mais pedidos.'}]
};
const GOAL=1500,DAYS=30,KEY='vida-garden-5',HS=20;
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pickA=a=>a[R(0,a.length-1)];
const fmt=n=>'€'+Math.round(n).toLocaleString('pt-PT');
const dayN=()=>Math.floor(S.t/24)+1;
const hour=()=>S.t%24;
const hm=()=>{const h=Math.floor(hour()),m=Math.floor((hour()-h)*6)*10;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const se=()=>Math.floor((dayN()-1)/8)%4;
const sm=sp=>SP[sp].pk[se()];
const mature=p=>p.age>=SP[p.sp].g;
const qual=p=>.5+p.h/200;
const ref=sp=>S.role==='garden'?SP[sp].ws*1.8*sm(sp):SP[sp].ws*sm(sp);
const market=p=>Math.round(SP[p.sp].ws*sm(p.sp)*.6*qual(p));
const supCost=(i,sp)=>Math.max(1,Math.round(SP[sp].ws*sm(sp)*SUP[i].m*(S.sf[sp]||1)));
const prodCost=sp=>SP[sp].seed+.5*SP[sp].g;
const pickSp=()=>{const w=KEYS.map(k=>sm(k));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return KEYS[i]}return KEYS[0]};
const freeSlot=()=>{for(let i=0;i<S.slots;i++)if(!S.plants.some(p=>p.slot===i)&&!VS.ghosts[i])return i;return -1};
const plant=(sp,age,w,h,pest,slot,cost)=>({id:S.nid++,sp,age,w,h,pest:!!pest,f:0,slot:slot??freeSlot(),cost:cost??0});
const wages=()=>STAFF[S.role].reduce((a,s)=>a+s.w*S.staff[s.k],0);
const newToday=()=>({cust:0,buy:0,earn:0,satSum:0,satN:0,miss:0,caro:0,feia:0,got:0,lost:0,del:0,late:0,pests:0,ready:[],lines:[]});

/* ================= side-view sprites (cards and sheets) ================= */
const fl=(x,y,c1,c2,r)=>[0,72,144,216,288].map(a=>`<circle cx="${(x+r*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(y+r*Math.sin(a*Math.PI/180)).toFixed(1)}" r="${r}" fill="${c1}"/>`).join('')+`<circle cx="${x}" cy="${y}" r="${(r*.65).toFixed(1)}" fill="${c2}"/>`;
const el=(x,y,rx,ry,r,f)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${x} ${y})" fill="${f}"/>`;

  S.alerts=[{id:S.nid++,t:S.t,who:G?nm('jard'):nm('trab'),lvl:'g',msg:G?`Olá! Sou a ${nm('jard')}, a jardineira. Rego e trato as plantas enquanto a loja está aberta (das ${hh(S.open)} às ${hh(S.close)}). Aviso-te aqui quando faltar alguma coisa.`:`Olá! Sou o ${nm('trab')}. A equipa trabalha das 08:00 às 18:00: regamos e tratamos as pragas. Aviso-te aqui dos pedidos e do que falta.`}];S.unread=1;
  setupWalkers();

function say(t){UI.toast=t;layer();clearTimeout(say.t);say.t=setTimeout(()=>{UI.toast='';layer()},2200)}
const P=id=>S.plants.find(p=>p.id==id);
const pay=c=>{if(S.money<c){say('Não tens dinheiro suficiente');return false}S.money-=c;return true};
const ready=sp=>S.plants.filter(p=>p.sp===sp&&mature(p)&&p.h>=50&&!VS.hidden.has(p.id)).sort((a,b)=>b.h-a.h);
function takeOut(p,dest){removePlant(p,dest,true)}
const slotCost=()=>[150,260,380,500,650,800][Math.max(0,Math.floor((S.slots-12)/6))]||999;
const expCost=()=>S.rows===2?500:1000;
function expand(){S.rows++;geo(S.rows);flushJobs();VS.walkers=VS.walkers.filter(w=>w.role!=='ped');setupWalkers()}
const UPG={
 prod:[{k:'amp',n:'Ampliar a estufa',d:'Mais uma fila de espaço: cabem mais 2 bancadas (12 vasos)',c:expCost,max:()=>S.rows>=4,run:expand},
  {k:'estufa',n:'Nova bancada',d:'Mais vasos na estufa',c:()=>S.rows===2?150:slotCost(),max:()=>S.slots>=S.rows*12,full:'Amplia primeiro a estufa',run:()=>S.slots=Math.min(S.rows*12,S.slots+(S.rows===2?8:6))},
  {k:'bio',n:'Controlo biológico',d:'Joaninhas na estufa: metade das pragas',c:()=>90}],
 garden:[{k:'amp',n:'Ampliar a loja',d:'Mais uma fila de espaço: cabem mais 2 mesas (12 lugares)',c:expCost,max:()=>S.rows>=4,run:expand},
  {k:'mesa',n:'Nova mesa',d:'Mais lugares na loja',c:()=>S.rows===2?150:slotCost(),max:()=>S.slots>=S.rows*12,full:'Amplia primeiro a loja',run:()=>S.slots=Math.min(S.rows*12,S.slots+(S.rows===2?8:6))},
  {k:'fid',n:'Programa de fidelização',d:'Cartão de selos com QR: os clientes fiéis voltam 60% mais vezes',c:()=>110},
  {k:'mkt',n:'Montra e redes sociais',d:'Mais gente da rua entra na loja',c:()=>80}]
};
function act(a,arg){
  if(S&&VS.phase==='night'&&!['tab','noop','hidetip','close-sheet'].includes(a))return;
  const p=S?P(arg):null,G=S&&S.role==='garden';
  switch(a){
  case'role':newGame(arg);setTimeout(()=>say('Arrasta o mapa para ver tudo. Toca nos ícones para abrir os painéis.'),400);break;
  case'tile':
    if(p)UI.sheet={t:'plant',id:p.id};
    else if(arg&&arg[0]==='x'){const i=+arg.slice(1);if(i>=S.slots){S.tab='upg';UI.sheet={t:'panel'};break}if(VS.ghosts[i])return say('Essa planta está a ser levada');if(G){S.tab='forn';UI.sheet={t:'panel'};break}UI.sheet={t:'seeds',slot:i}}
    break;
  case'seed':{let i=UI.sheet&&UI.sheet.slot!=null?UI.sheet.slot:freeSlot();if(i<0||S.plants.some(q=>q.slot===i))i=freeSlot();if(i<0)return say('A estufa está cheia');if(!pay(SP[arg].seed))return;const np=plant(arg,0,60,100,false,i,SP[arg].seed);S.plants.push(np);VS.hidden.add(np.id);VS.jobs.push({k:'seed',slot:i,pid:np.id});UI.sheet=null;S.v++;break}
  case'water':p.w+=45;if(p.w>100){p.h=Math.max(1,p.h-10);say(SP[p.sp].n+' encharcada: perdeu saúde')}p.w=Math.min(100,p.w);VS.jobs.push({k:'water',slot:p.slot});UI.sheet=null;break;
  case'waterAll':{let o=0;S.plants.forEach(q=>{q.w+=45;if(q.w>100){q.h=Math.max(1,q.h-10);o++}q.w=Math.min(100,q.w);VS.jobs.push({k:'water',slot:q.slot})});if(o)say(o+(o>1?' plantas ficaram encharcadas':' planta ficou encharcada'));break}
  case'fert':if(p.f>0)return say('Já está adubada');if(!pay(1))return;p.f=24;VS.jobs.push({k:'fert',slot:p.slot});UI.sheet=null;say('Adubada: cresce a dobrar nas próximas 24 horas');break;
  case'treat':if(!pay(2))return;p.pest=false;VS.jobs.push({k:'treat',slot:p.slot});UI.sheet=null;break;
  case'market':{const v=market(p);S.money+=v;S.earned+=v;S.sold++;takeOut(p,'van');UI.sheet=null;say('Vai na carrinha para o mercado: +'+fmt(v));break}
  case'toss':takeOut(p,'bin');UI.sheet=null;break;
  case'buy':{const[i,sp,n]=arg.split('|');let k=0;for(;k<+n;k++){const s=freeSlot();if(s<0){if(!k)return say('Não há lugar nas mesas');break}const c=supCost(+i,sp);if(S.money<c){if(!k)return say('Não tens dinheiro suficiente');break}S.money-=c;const q=SUP[+i].q,np=plant(sp,SP[sp].g,55,R(q[0],q[1]),false,s,c);S.plants.push(np);VS.hidden.add(np.id);spawnCourier(s,np.id,{...np},k)}S.v++;say(`${k} ${SP[sp].n} a caminho`);break}
  case'deliver':{const o=S.orders.find(x=>x.id==arg);if(!o)return;const v=deliverOrder(o,true);if(!v)return;say(`Entregue a ${o.who}: +${fmt(v)}`);break}
  case'upg':{const u=UPG[S.role].find(x=>x.k===arg);if(!pay(u.c()))return;if(u.run)u.run();else S.upg[u.k]=1;S.v++;say(u.n+': feito');break}
  case'hire':{const d=STAFF[S.role].find(x=>x.k===arg);if(S.staff[arg]>=d.max)return;S.staff[arg]++;setupWalkers();S.v++;say(`${d.n} contratado: ${fmt(d.w)} por dia`);break}
  case'fire':{const d=STAFF[S.role].find(x=>x.k===arg);if(S.staff[arg]<=d.min)return;S.staff[arg]--;setupWalkers();S.v++;break}
  case'price':{const[sp,d]=arg.split('|');S.price[sp]=Math.max(1,S.price[sp]+(+d));S.v++;break}
  case'lamt':UI.lamt=+arg;break;
  case'ldays':UI.ldays=+arg;break;
  case'loan':{const lim=limit(),a=Math.min(UI.lamt||250,lim),d=UI.ldays||10;if(score()<450||a>lim)return say('O banco recusou este valor');const tm=loanTerms(a,d);S.money+=a;S.bank.loans.push({id:S.nid++,amount:a,left:tm.total,inst:tm.inst});S.v++;say(`Crédito aprovado: +${fmt(a)}`);break}
  case'payoff':{const l=S.bank.loans.find(x=>x.id==arg);if(!l)return;if(S.money<l.left)return say('Não tens dinheiro para pagar tudo');S.money-=l.left;l.left=0;S.bank.loans=S.bank.loans.filter(x=>x!==l);S.bank.paid++;S.bank.ok++;S.v++;say('Empréstimo pago. A nota de crédito subiu');break}
  case'tab':S.tab=arg;UI.sheet={t:'panel'};if(arg==='alerts')S.unread=0;break;
  case'hidetip':{const t=$('#tip');if(t)t.hidden=true;return}
  case'auto':S.auto[arg]=!S.auto[arg];if(arg==='restock'&&S.auto.restock)restock(true);if(arg==='deliver'&&S.auto.deliver)autoDeliver(true);break;
  case'autosup':S.auto.sup=+arg;break;
  case'reserve':S.auto.reserve=+arg;break;
  case'hours':{const[k,d]=arg.split('|');if(k==='open')S.open=clamp(S.open+(+d),6,12);else S.close=clamp(S.close+(+d),15,23);break}
  case'readall':S.alerts=[];S.unread=0;break;
  case'close-sheet':UI.sheet=null;break;
  case'next':S.report=null;break;
  case'restart':S=null;UI.sheet=null;geo(2);resetVS();break;
  case'wonok':S.wonSeen=true;break;
  case'noop':return;
  }
  save();draw();
}

/* ---------- bank ---------- */
const debt=()=>S.bank.loans.reduce((a,l)=>a+l.left,0);
const net=()=>S.money-debt();
const avgRev=()=>S.earned/Math.max(1,dayN()-1+hour()/24);
function score(){const b=S.bank;return Math.round(clamp(520+b.ok*10-b.miss*70+b.paid*40+(S.rep-50)*2+Math.min(150,avgRev()*.6)-debt()*.06,300,900))}
function rating(sc){return sc>=750?{n:'Excelente',r:.04,c:'g'}:sc>=650?{n:'Bom',r:.07,c:'g'}:sc>=550?{n:'Razoável',r:.11,c:'w'}:sc>=450?{n:'Fraco',r:.16,c:'w'}:{n:'Recusado',r:0,c:'r'}}
function limit(){const sc=score();if(sc<450)return 0;return Math.max(0,Math.floor((clamp((400+avgRev()*6)*(sc/650),0,4000)-debt())/50)*50)}
function loanTerms(a,d){const rt=rating(score()).r+(d>10?.03:0),total=Math.round(a*(1+rt));return{rt,total,inst:Math.ceil(total/d)}}
function payLoans(){
  const b=S.bank;
  b.loans.forEach(l=>{
    if(S.money>=l.inst||S.money>=l.left){const v=Math.min(l.inst,l.left);S.money-=v;l.left-=v;b.ok++;S.today.lines.push(['',`Banco: prestação paga −${fmt(v)} (faltam ${fmt(l.left)})`])}
    else{b.miss++;l.left+=10;S.today.lines.push(['r',`Banco: prestação falhada por falta de dinheiro. Multa de €10 e a tua nota de crédito desceu`])}
  });
  const done=b.loans.filter(l=>l.left<=0);done.forEach(()=>{b.paid++;S.today.lines.push(['g','Empréstimo totalmente pago. A tua nota de crédito subiu'])});
  b.loans=b.loans.filter(l=>l.left>0);
}
function bankPanel(){
  const sc=score(),rt=rating(sc),lim=limit(),b=S.bank,amt=Math.min(UI.lamt||250,lim),days=UI.ldays||10,tm=loanTerms(amt,days);
  const fac=[['Pagamentos a tempo',b.ok],['Prestações falhadas',b.miss],['Empréstimos pagos',b.paid],['Faturação média',fmt(avgRev())+'/dia'],['Reputação',Math.round(S.rep)],['Dívida atual',fmt(debt())]];
  let h=`<div class="card" style="grid-template-columns:1fr"><h3>Análise de crédito</h3>${meter('Nota',(sc-300)/6,rt.c,sc+' · '+rt.n)}<dl class="kv">${fac.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><p>Pagar as prestações a tempo e faturar mais sobe a nota. Falhar uma prestação desce muito.</p></div>`;
  if(sc<450)h+=`<div class="card" style="grid-template-columns:1fr"><h3>Crédito recusado</h3><p>A tua nota está abaixo de 450. Paga o que deves e vende mais para voltar a ter crédito.</p></div>`;
  else{
    const opts=[...new Set([100,250,500,1000,2000].filter(v=>v<lim).concat(lim))];
    h+=`<div class="card" style="grid-template-columns:1fr"><h3>Pedir empréstimo</h3><p>Podes pedir até <b>${fmt(lim)}</b>. Juro ${Math.round(rt.r*100)}% (prazo de 20 dias: +3%). A prestação é cobrada à meia-noite.</p>
    <div class="seg">${opts.map(v=>`<button data-act="lamt" data-arg="${v}" aria-pressed="${amt===v}">${v===lim?'Máximo '+fmt(v):fmt(v)}</button>`).join('')}</div>
    <div class="seg">${[10,20].map(v=>`<button data-act="ldays" data-arg="${v}" aria-pressed="${days===v}">${v} dias</button>`).join('')}</div>
    <dl class="kv"><dt>Recebes agora</dt><dd>${fmt(amt)}</dd><dt>Total a pagar</dt><dd>${fmt(tm.total)}</dd><dt>Prestação</dt><dd>${fmt(tm.inst)} por dia, ${days} dias</dd></dl>
    <div class="row" style="margin-top:8px"><span></span><button class="btn" data-act="loan" ${amt>lim?'disabled':''}>Pedir ${fmt(amt)}</button></div></div>`;
  }
  h+=b.loans.map(l=>`<div class="card" style="grid-template-columns:1fr"><h3>Empréstimo de ${fmt(l.amount)}</h3><p>Falta pagar ${fmt(l.left)} · prestação ${fmt(l.inst)}/dia</p><div class="row"><span></span><button class="btn alt" data-act="payoff" data-arg="${l.id}">Pagar tudo agora · ${fmt(l.left)}</button></div></div>`).join('');
  return h;

/* ================= interface ================= */
const trend=sp=>sm(sp)>=1.2?'<span class="hot">em alta</span>':sm(sp)<=.7?'<span class="cold">procura fraca</span>':'procura normal';
function priceTag(r){return r<.9?['barato','g']:r<=1.1?['preço justo','g']:r<=1.3?['caro','w']:['muito caro','r']}
function tip(){
  const G=S.role==='garden',h=hour();
  if(!isOpen())return G?`A loja está fechada. Abre às <b>${hh(S.open)}</b>. Podes comprar plantas e mudar preços na mesma.`:`A equipa está em casa. O trabalho recomeça às <b>08:00</b>.`;
  const t=S.plants.find(p=>p.w<25&&!VS.hidden.has(p.id)),pe=S.plants.find(p=>p.pest),o=S.orders.find(o=>ready(o.sp).length>=o.qty);
  if(S.unread)return`Tens <b>${S.unread} ${S.unread>1?'avisos':'aviso'}</b> da equipa. Toca no sino.`;
  if(o&&!(S.auto&&S.auto.deliver))return`Já podes entregar o pedido de <b>${o.who}</b>.`;
  if(t)return`A <b>${SP[t.sp].n}</b> tem sede (gota azul). A equipa vai regar, ou toca nela.`;
  if(pe)return`Há praga na <b>${SP[pe.sp].n}</b> (sinal vermelho).`;
  if(G){
    if(VS.q.length>=4&&!S.staff.caixa)return`Fila grande no balcão. Contrata um <b>caixa</b> em Equipa.`;

  }

}

   <div class="card" style="grid-template-columns:1fr"><h3>Como está a loja</h3>${meter('Satisfação',S.sat,S.sat>=65?'g':S.sat>=45?'w':'r',Math.round(S.sat)+'%')}${meter('Movimento agora',Math.min(100,lamAt(hour())/6*100),'b',lamAt(hour()).toFixed(1)+' clientes/h')}${meter('Clientes fiéis',Math.min(100,S.fans*3),'g',S.fans)}<p>Clientes contentes voltam e trazem amigos. Descontentes não voltam, e o movimento cai.</p></div>`
   +KEYS.map(k=>`<div class="card">${spr(k)}<div><h3>${SP[k].n}</h3><p>${trend(k)} · ${cnt(k)} nas mesas · vendes a ${fmt(S.price[k])}</p></div></div>`).join('');
  return`<div class="card" style="grid-template-columns:1fr"><h3>A equipa trata sozinha</h3><p>Funciona mesmo quando não estás, das 08:00 às 18:00.</p><div class="seg"><button data-act="auto" data-arg="deliver" aria-pressed="${S.auto.deliver}">Entregar pedidos prontos: ${S.auto.deliver?'sim':'não'}</button></div><div class="seg"><button data-act="auto" data-arg="resow" aria-pressed="${S.auto.resow}">Voltar a semear a mesma planta: ${S.auto.resow?'sim':'não'}</button></div></div><div class="seg"><button class="btn" data-act="waterAll" style="background:var(--water)">Regar tudo</button><span class="note" style="margin:0">Nas bancadas: ${S.plants.length} de ${S.slots}</span></div>`
   +KEYS.map(k=>{const ps=S.plants.filter(p=>p.sp===k),r=ps.filter(mature).length;return`<div class="card">${spr(k)}<div><h3>${SP[k].n}</h3><p>${SP[k].g} dias a crescer · semente ${fmt(SP[k].seed)} · ${trend(k)}</p><p>${r} prontas · ${ps.length-r} a crescer · vendes a ${fmt(S.price[k])}</p></div></div>`}).join('');
}
const meter=(l,v,c,t)=>`<div class="meter"><span>${l}</span><span class="track"><i class="${c}" style="width:${clamp(v,2,100)}%"></i></span><b>${t}</b></div>`;
function sheet(){
  if(VS.phase==='night')return'';
  if(S.won&&!S.wonSeen)return`<div class="back"><div class="sheet" data-act="noop"><h2>Conseguiste!</h2><p>Chegaste aos ${fmt(GOAL)} sem dívidas. O teu ${S.role==='garden'?'garden':'negócio'} continua aberto: agora é crescer.</p><dl class="kv"><dt>Caixa</dt><dd>${fmt(S.money)}</dd><dt>Plantas vendidas</dt><dd>${S.sold}</dd><dt>Total faturado</dt><dd>${fmt(S.earned)}</dd><dt>Reputação</dt><dd>${Math.round(S.rep)}/100</dd></dl><div class="acts"><button class="btn" data-act="wonok">Continuar</button><button class="btn alt" data-act="restart">Começar de novo</button></div></div></div>`;
  if(S.report)return`<div class="back"><div class="sheet" data-act="noop" data-k="rep"><h2>${S.report.title||'Resumo'}</h2><ul class="rep">${S.report.lines.map(([c,t])=>`<li class="${c}">${t}</li>`).join('')}</ul><button class="btn" data-act="next">Continuar</button></div></div>`;
  if(!UI.sheet)return'';
  if(UI.sheet.t==='panel'){const tt=TITLES();return`<div class="back" data-act="close-sheet"><div class="sheet big" data-act="noop" data-k="panel${S.tab}"><div class="sh-h"><h2>${tt[S.tab]}</h2><button class="xb" data-act="close-sheet" aria-label="Fechar">${ic('x')}</button></div><section class="cards" id="cards">${panel()}</section></div></div>`}
  if(UI.sheet.t==='seeds')return`<div class="back" data-act="close-sheet"><div class="sheet" data-act="noop"><h2>O que semear?</h2><p class="note">Tens ${fmt(S.money)}. Um trabalhador leva o tabuleiro até ao vaso.</p><div class="list">${KEYS.map(k=>`<div class="lrow">${spr(k)}<span><b>${SP[k].n}</b><small>${SP[k].g} dias · ${trend(k)} · vendes a ${fmt(S.price[k])}</small></span><button class="btn" data-act="seed" data-arg="${k}">${fmt(SP[k].seed)}</button></div>`).join('')}</div><div class="acts"><button class="btn alt" data-act="close-sheet">Fechar</button></div></div></div>`;
  const p=P(UI.sheet.id);if(!p){UI.sheet=null;return''}
  const g=SP[p.sp].g,m=mature(p),G=S.role==='garden';
  return`<div class="back" data-act="close-sheet"><div class="sheet" data-act="noop"><div class="top">${spr(p.sp,Math.min(1,p.age/g),p.pest,p.h<45)}<div><h2>${SP[p.sp].n}</h2><dl class="kv"><dt>Água</dt><dd>${Math.round(p.w)}%</dd><dt>Saúde</dt><dd>${Math.round(p.h)}%</dd>${G?`<dt>Preço de venda</dt><dd>${fmt(S.price[p.sp])} <small>(comprada a ${fmt(p.cost)})</small></dd>`:`<dt>Crescimento</dt><dd>${m?'pronta':`dia ${Math.floor(p.age)+1} de ${g}`}</dd>`}<dt>Estado</dt><dd>${p.pest?'com praga':p.h<45?'fraca':p.w<25?'com sede':'bem'}</dd></dl></div></div><div class="acts"><button class="btn" data-act="water" data-arg="${p.id}" style="background:var(--water)">Regar</button>${!G&&!m?`<button class="btn alt" data-act="fert" data-arg="${p.id}" ${p.f>0?'disabled':''}>Adubar · €1</button>`:''}${p.pest?`<button class="btn pink" data-act="treat" data-arg="${p.id}">Tratar praga · €2</button>`:''}${!G&&m?`<button class="btn alt" data-act="market" data-arg="${p.id}">Vender no mercado · ${fmt(market(p))}</button>`:''}${p.h<45?`<button class="btn alt" data-act="toss" data-arg="${p.id}">Deitar fora</button>`:''}<button class="btn alt" data-act="close-sheet">Fechar</button></div></div></div>`;
}

const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const TITLES=()=>({main:S.role==='garden'?'A tua loja':'A tua estufa',price:'Preços e lucro',forn:'Comprar plantas',orders:S.role==='garden'?'Encomendas':'Pedidos dos gardens',team:'Equipa',upg:'Obras e melhorias',bank:'Banco',alerts:'Avisos da equipa'});
function camFit(){
  const cv=$('#map');if(!cv)return null;const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return null;
  const top=W<700?96:70,bot=W<700?150:110;
  const fit=Math.max((H-top-bot)/SH,W/SW),cam=VS.cam||(VS.cam={k:1,x:null,y:null});
  const z=fit*cam.k,vw=W/z,vh=H/z,T0=top/z,B0=bot/z;
  if(cam.x==null)cam.x=(SW-vw)/2;
  cam.x=SW<=vw?(SW-vw)/2:clamp(cam.x,0,SW-vw);
  const ct=SH+T0+B0;
  if(cam.y==null)cam.y=-T0-(vh-ct)/2;
  cam.y=ct<=vh?-T0-(vh-ct)/2:clamp(cam.y,-T0,SH+B0-vh);
  return{W,H,z,vw};
}
function render(){
  const cv=$('#map');if(!cv)return;const f=camFit();if(!f)return;
  const d=Math.min(2,devicePixelRatio||1),pw=Math.round(f.W*d),ph=Math.round(f.H*d);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
  const D=stateWorld();D.view={x:VS.cam.x,y:VS.cam.y,w:f.vw};drawWorld(cv,D);
}
function hud(){
  if(!$('#c-money'))return;const dv=debt(),pct=Math.round(Math.max(0,net()/GOAL*100));
  $('#c-money b').textContent=fmt(S.money);
  const de=$('#c-debt');de.hidden=!dv;de.textContent=dv?'dívida '+fmt(dv):'';
  $('#c-goal i').style.width=clamp(pct,0,100)+'%';$('#c-goal b').textContent=pct+'%';
  if(!S.won&&net()>=GOAL){S.won=true;layer()}
  const bl=$('#b-alerts');bl.textContent=S.unread;bl.hidden=!S.unread;
  const n=$('#b-orders');n.textContent=S.orders.length;n.hidden=!S.orders.length;
  const tp=$('#tip'),t=tip();if(tp.dataset.t!==t){tp.dataset.t=t;tp.innerHTML=t;tp.hidden=false}
}
function clockTick(){
  const el=$('#c-day');if(!el)return;const h=hour(),night=h>=20||h<7,G=S.role==='garden',op=isOpen();
  el.innerHTML=`${ic(night?'moon':'sun')}<span><b>${hm()}</b><small>Dia ${dayN()} · ${op?(G?'aberta até '+hh(S.close):'a trabalhar'):(G?'fechada · abre '+hh(S.open):'equipa em casa')}</small></span>`;
}
function panelDraw(){const el=$('#cards');if(!el)return;VS.pv=S.v+'|'+Math.floor(S.t);el.innerHTML=panel()}
function layer(){
  const L=$('#layer');if(!S){L.innerHTML='';return}
  const old=L.querySelector('.sheet'),st=old?old.scrollTop:0,same=old&&old.dataset.k===sheetKey();
  L.innerHTML=sheet()+(UI.toast?`<div class="toast" role="status">${UI.toast}</div>`:'');
  const nw=L.querySelector('.sheet');if(nw&&same)nw.scrollTop=st;
}
const sheetKey=()=>S.over?'over':S.report?'rep':UI.sheet?UI.sheet.t+(UI.sheet.t==='panel'?S.tab:UI.sheet.id||''):'';
function shell(){
  if($('#map'))return;
  const G=S.role==='garden';
  const dock=(G?[['main','store','Loja'],['price','tag','Preços'],['forn','truck','Comprar'],['orders','clip','Pedidos'],['team','team','Equipa'],['upg','hammer','Obras'],['bank','bank','Banco']]:[['main','sprout','Estufa'],['price','tag','Preços'],['orders','clip','Pedidos'],['team','team','Equipa'],['upg','hammer','Obras'],['bank','bank','Banco']]);
  $('#game').innerHTML=`<div class="stage"><canvas id="map" aria-label="Mapa"></canvas>
  <header class="top"><div class="chip day" id="c-day"></div><button class="chip" id="c-money" data-act="tab" data-arg="bank">${ic('coin')}<b></b><small id="c-debt" class="r" hidden></small></button><button class="chip goal" id="c-goal" data-act="tab" data-arg="main" aria-label="Meta">${ic('flag')}<span class="gt"><i></i></span><b></b></button></header>
  <p class="tipb" id="tip" data-act="hidetip"></p>
  <div class="side-ctl"><button class="rb bell" data-act="tab" data-arg="alerts" aria-label="Avisos da equipa">${ic('bell')}<em id="b-alerts" hidden></em></button><button class="rb water" data-act="waterAll" aria-label="Regar tudo">${ic('drop')}</button></div>
  <nav class="dock">${dock.map(([k,i,l])=>`<button data-act="tab" data-arg="${k}">${ic(i)}<span>${l}</span>${k==='orders'?'<em id="b-orders" hidden></em>':''}</button>`).join('')}</nav>
  <div class="sr" id="srs"></div></div>`;
  const cv=$('#map'),pts=new Map();let drag=null;
  const toWorld=(cx,cy)=>{const r=cv.getBoundingClientRect(),f=camFit();return{x:VS.cam.x+(cx-r.left)/f.z,y:VS.cam.y+(cy-r.top)/f.z}};
  const hit=(cx,cy)=>{const{x,y}=toWorld(cx,cy);if(LV1ON){const sy=64+y*.72;let b=-1,bb=-1;for(let i=0;i<24;i++){const q=lv1Pot(i);if(i>=S.slots){const[bl,br,fl,fr,by_,fy]=L1.B[q.b];if(x>Math.min(bl,fl)*L1.s&&x<Math.max(br,fr)*L1.s&&sy>by_*L1.s&&sy<fy*L1.s)return i;continue}if(Math.abs(x-q.sx)<q.rim*.8&&sy>q.sy-q.rim*1.9&&sy<q.sy+5&&q.sy>bb){b=i;bb=q.sy}}return b}let b=-1,by=-1;for(let i=0;i<12*S.rows;i++){if(LV1ON)break;const p=slotPos(i),open=i<S.slots,yy=Y(p.y,open?TBH:0);if(Math.abs(x-p.x)<22&&y>yy-(open?46:16)&&y<yy+(open?8:16)&&p.y>by){b=i;by=p.y}}return b};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1)drag={x:e.clientX,y:e.clientY,cx:VS.cam.x,cy:VS.cam.y,moved:false};else if(drag)drag.moved=true});
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)){cv.style.cursor=hit(e.clientX,e.clientY)>=0?'pointer':'grab';return}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(drag.moved){const f=camFit();VS.cam.x=drag.cx-dx/f.z;VS.cam.y=drag.cy-dy/f.z;camFit()}}});
  const up=e=>{if(drag&&!drag.moved&&pts.size===1&&S){const i=hit(e.clientX,e.clientY);if(i>=0){const p=S.plants.find(q=>q.slot===i&&!VS.hidden.has(q.id));act('tile',p?String(p.id):'x'+i)}}pts.delete(e.pointerId);if(!pts.size)drag=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);drag=null});
}
function draw(){
  const st=$('#start'),gm=$('#game');
  document.body.classList.toggle('playing',!!S);
  if(!S){st.hidden=false;gm.hidden=true;gm.innerHTML='';layer();return}
  st.hidden=true;gm.hidden=false;shell();
  $('#srs').innerHTML=[...Array(S.slots)].map((_,i)=>{const p=S.plants.find(q=>q.slot===i);return`<button data-act="tile" data-arg="${p?p.id:'x'+i}">${p?`${SP[p.sp].n}, água ${Math.round(p.w)}%, saúde ${Math.round(p.h)}%`:'Lugar vazio'}</button>`}).join('');
  hud();clockTick();panelDraw();layer();
}
function save(){try{S?localStorage.setItem(KEY,JSON.stringify(S)):localStorage.removeItem(KEY)}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
const DEMO={};
function demo(role){
  if(DEMO[role])return DEMO[role];
  const sps=role==='garden'?['petunia','orquidea','lavanda','suculenta','monstera','petunia','lavanda','oliveira','petunia','suculenta','orquidea','monstera']:['petunia','lavanda','suculenta','orquidea','monstera','oliveira','petunia','lavanda','suculenta','monstera','petunia','lavanda'];
  const ages=role==='garden'?sps.map(()=>99):[3,2,1,7,4,9,3,1,5,6,0,4];
  const vis=sps.map((sp,i)=>({p:{sp,age:ages[i],h:95,w:80,pest:false}}));for(let i=0;i<12;i++)vis.push({p:{sp:sps[i],age:ages[i]+2,h:95,w:80}});
  const walkers=role==='garden'?[mkW({...W1(552,600),dir:Math.PI/2,moving:true,look:{shirt:'#3d7cc9',hair:'#5a3825',skin:'#e0ac7e'},carry:{kind:'plant',p:{sp:'petunia',age:3,h:90}}}),mkW({...W1(793,520),dir:-Math.PI/2,look:{shirt:'#f2b134',hair:'#1b1b1b',skin:'#c68642'},bubble:'happy'}),mkW({...W1(312,480),dir:Math.PI/2,look:LOOKS.jard[0],carry:{kind:'can'}})]
   :[mkW({...W1(565,560),dir:Math.PI/2,moving:true,look:LOOKS.trab[0],carry:{kind:'can'}}),mkW({...W1(325,520),dir:-Math.PI/2,look:LOOKS.trab[1],carry:{kind:'tray'}})];
  walkers.forEach(w=>w.sc=1.25);
  return DEMO[role]={role,slots:12,vis,walkers,door:0,van:{x:0,load:0},svan:0,parts:[],floats:[],night:0,sel:null,view:role==='prod'?{x:90,y:60,w:280}:{x:60,y:85,w:280},lv1:true,slots:24};
}
function startArt(dt){
  [['artGarden','garden'],['artProd','prod']].forEach(([id,role])=>{
    const cv=$('#'+id);if(!fitCanvas(cv,9/16))return;const D=demo(role);
    D.walkers.forEach(w=>{if(w.moving)w.walk+=dt*40});
    drawWorld(cv,D);
  });
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||b.closest('#map'))return;act(b.dataset.act,b.dataset.arg)});
document.addEventListener('pointerdown',()=>{VS.pd=true});
document.addEventListener('pointerup',()=>{setTimeout(()=>{VS.pd=false},60)});
document.addEventListener('pointercancel',()=>{VS.pd=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet){UI.sheet=null;draw()}});
function start(d){
  rigLoad();assetLoad();plLoad();
  S=(d&&d.role&&d.base)?d:load();
  if(S&&(!S.plants||!S.base||S.plants.some(p=>p.slot==null)))S=null;
  geo(S&&S.rows||2);resetVS();VS.cam=null;VS.live=true;
  if(S){catchUp();setupWalkers()}
  draw();requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
